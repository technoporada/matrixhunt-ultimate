name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # pin: ubuntu-latest za chwile zmienia sie na Ubuntu 26 (ogloszenie GitHuba
    # od 19.10.2026) - trzymamy 24.04, zeby build byl powtarzalny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Kompilacja (py_compile)
        run: python -m compileall -q backend

      - name: Testy (pytest)
        run: python -m pytest tests/ -q

      - name: Akcje przypięte do SHA
        run: |
          set -eu
          if grep -rnE '^[[:space:]]*uses:[[:space:]]*[^#]+@(v[0-9]|main|master)([[:space:]]|$)' .github/workflows/*.yml; then
            echo "Akcja używa ruchomego tagu — przypnij do SHA." >&2
            exit 1
          fi