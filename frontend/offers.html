<!DOCTYPE html>
<html lang="en" data-mh-no-float>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <script>try{var _l=localStorage.getItem('mh_lang');if(_l!=='pl'&&_l!=='en'){_l=(navigator.language||'en').toLowerCase().indexOf('pl')===0?'pl':'en';}document.documentElement.setAttribute('data-lang',_l);}catch(e){document.documentElement.setAttribute('data-lang','en');}</script>
    <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('mh_theme')==='night'||localStorage.getItem('mh_theme')==='day'?localStorage.getItem('mh_theme'):'matrix')}catch(e){document.documentElement.setAttribute('data-theme','matrix')}</script>
    <title>OFERTY — MATRIXHUNT ULTIMATE</title>
    <meta name="theme-color" content="#000">
    <link rel="manifest" href="/manifest.json">
    <style>
        :root {
            --green: #0f0;
            --dim-green: rgba(0,255,0,0.15);
            --dark-bg: #050505;
            --card-bg: rgba(0,60,0,0.95);
            --glow: 0 0 10px #0f0, 0 0 20px rgba(0,255,0,0.3);
            --font: 'Courier New', 'Lucida Console', monospace;
        }
        /* Palette switching is handled by /tools/theme.css via [data-theme].
           The old .light-theme override only set --dark-bg/--card-bg, which the
           shared layer does not read, so it was removed. */
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--dark-bg);
            color: var(--green);
            font-family: var(--font);
            min-height: 100vh;
            overflow-x: hidden;
        }
        canvas#matrix-bg {
            position: fixed;
            top:0; left:0;
            width:100%; height:100%;
            z-index: 0;
            pointer-events: none;
        }
        .scanlines {
            position: fixed;
            top:0; left:0;
            width:100%; height:100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.05) 0px,
                rgba(0,0,0,0.05) 1px,
                transparent 1px,
                transparent 3px
            );
            z-index: 1;
            pointer-events: none;
        }
        #app {
            position: relative;
            z-index: 2;
            max-width: 1400px;
            margin: 0 auto;
            padding: 10px 15px 40px;
        }
        header {
            text-align: center;
            padding: 20px 0 10px;
        }
        header h1 {
            font-size: 2.2em;
            letter-spacing: 8px;
            text-shadow: var(--glow);
            border: 2px solid var(--green);
            display: inline-block;
            padding: 10px 30px;
            background: rgba(0,30,0,0.95);
        }
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 12px;
            border: 2px solid var(--green);
            margin: 15px 0;
            background: rgba(0,40,0,0.95);
            flex-wrap: wrap;
            font-size: 0.95em;
            font-weight: bold;
            box-shadow: var(--glow);
        }
        .stats-bar span { white-space: nowrap; }
        .controls {
            display: flex;
            gap: 10px;
            row-gap: 20px;
            margin: 15px 0 20px;
            flex-wrap: wrap;
            align-items: stretch;
        }
        .ctl-group {
            display: flex;
            gap: 8px;
            align-items: center;
            border: 1px solid var(--green);
            padding: 10px 10px;
            margin-top: 8px;
            position: relative;
            flex-wrap: wrap;
        }
        .ctl-group > .ctl-label {
            position: absolute;
            top: -9px;
            left: 8px;
            background: var(--dark-bg);
            padding: 0 6px;
            font-size: 0.62em;
            letter-spacing: 2px;
            opacity: 0.75;
        }
        .ctl-search {
            flex: 1 1 100%;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .controls select, .controls input {
            background: rgba(0,30,0,0.95);
            color: var(--green);
            border: 1px solid var(--green);
            padding: 8px 12px;
            font-family: var(--font);
            font-size: 0.9em;
            cursor: pointer;
        }
        .controls input { flex: 1; min-width: 200px; }
        .controls input::placeholder { color: rgba(0,255,0,0.4); }
        button, .btn {
            background: rgba(0,30,0,0.95);
            color: var(--green);
            border: 1px solid var(--green);
            padding: 8px 16px;
            font-family: var(--font);
            font-size: 0.85em;
            cursor: pointer;
            white-space: nowrap;
        }
        button:hover, .btn:hover {
            background: var(--green);
            color: #000;
            box-shadow: var(--glow);
        }
        .btn-fav-active {
            background: #0f0 !important;
            color: #000 !important;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .game-card {
            border: 2px solid var(--green);
            padding: 15px;
            background: rgba(0,50,0,0.95);
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 0 8px rgba(0,255,0,0.3);
        }
        .game-card:hover {
            box-shadow: var(--glow);
            transform: translateY(-2px);
        }
        .game-card h3 {
            font-size: 1em;
            margin: 0;
            word-break: break-word;
        }
        .game-card .meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            font-size: 0.8em;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border: 1px solid var(--green);
            font-size: 0.8em;
        }
        .badge-price { color: #0f0; }
        .badge-login { color: #f80; border-color: #f80; }
        .badge-adfly { color: var(--bad, #f44); border-color: var(--bad, #f44); }
        .badge-captcha { color: #ff0; border-color: #ff0; }
        .badge-free { color: #0f0; border-color: #0f0; background: rgba(0,255,0,0.15); }
        .game-card .desc {
            font-size: 0.8em;
            opacity: 0.7;
            max-height: 3em;
            overflow: hidden;
        }
        .game-card .actions {
            margin-top: auto;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .btn-access {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            letter-spacing: 3px;
            text-decoration: none;
        }
        .btn-fav {
            padding: 10px 12px;
            font-size: 1.1em;
        }
        .back-link {
            position: fixed;
            bottom: 15px;
            left: 15px;
            z-index: 10;
            text-decoration: none;
        }
        footer {
            text-align: center;
            padding: 30px 0 10px;
            border-top: 1px solid rgba(0,255,0,0.3);
            margin-top: 30px;
        }
        footer a {
            color: var(--green);
            text-decoration: none;
            margin: 0 12px;
            font-size: 0.85em;
        }
        footer a:hover { text-decoration: underline; }
        .shortcuts-hint {
            text-align: center;
            font-size: 0.75em;
            opacity: 0.5;
            margin-top: 10px;
        }
        .toast {
            position: fixed;
            bottom: 60px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--green);
            padding: 12px 20px;
            z-index: 100;
            animation: fadeIn 0.3s;
            box-shadow: var(--glow);
        }
        @keyframes fadeIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
        @media (max-width: 768px) {
            header h1 { font-size: 1.3em; letter-spacing: 4px; padding: 8px 15px; }
            .stats-bar { gap: 15px; font-size: 0.8em; }
            .controls { flex-direction: column; }
            .controls input { min-width: unset; width: 100%; }
            .games-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 480px) {
            header h1 { font-size: 1em; letter-spacing: 2px; }
            .stats-bar { flex-direction: column; gap: 5px; }
        }
    </style>
    <link rel="stylesheet" href="/tools/theme.css">
</head>
<body>
    <canvas id="matrix-bg"></canvas>
    <div class="scanlines"></div>
    <div id="app"></div>

    <!-- Vendored locally (frontend/vendor/): zero third-party requests,
         dashboard works fully offline. Pinned React 18.3.1 + Babel 7.24.7. -->
    <script src="/static/vendor/react.production.min.js"></script>
    <script src="/static/vendor/react-dom.production.min.js"></script>
    <script src="/tools/theme.js"></script>
    <script src="/tools/api.js"></script>
    <script src="/tools/lang.js"></script>
    <script src="/tools/outbound.js"></script>
    <script src="/tools/site.js"></script>


    <!-- offers.js jest skompilowany z offers.jsx przy budowaniu (tools/build_frontend.js).
         Wczytujemy gotowy JS zamiast kompilowac JSX w przegladarce: 749 ms i 2,73 MB mniej
         na kazdym wejsciu (pomiar: babel boot 287 ms + kompilacja 462 ms). -->
    <script src="/static/offers.js"></script>
</body>
</html>
